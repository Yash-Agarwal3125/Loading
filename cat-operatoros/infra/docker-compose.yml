# Local development. Not a production topology.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: operatoros
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build: ../services/api
    depends_on: [db, redis, minio]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@db:5432/operatoros
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: local
    ports: ["8000:8000"]

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]

volumes:
  dbdata:
  miniodata:
